  <!-- CONTENU PRINCIPAL -->
  <main class="main-content">
    <div class="page-header">
      <h1>Gestion des ressources</h1>
      <p>Ajoute, modifie ou supprime des ressources pédagogiques.</p>
    </div>

    <!-- FORMULAIRE D'AJOUT -->
    <div class="admin-card">
      <h2>Ajouter une nouvelle ressource</h2>
      <form id="add-ressource-form">
        <div class="form-group">
          <label for="title">Titre *</label>
          <input type="text" id="title" required>
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" rows="3" required></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="type">Type *</label>
            <select id="type" required>
              <option value="video">Vidéo</option>
              <option value="pdf">PDF/Fiche</option>
              <option value="lien">Lien externe</option>
              <option value="fiche">Fiche</option>
            </select>
          </div>

          <div class="form-group">
            <label for="category">Matière *</label>
            <select id="category" required>
              <option value="Maths">Maths</option>
              <option value="Physique-Chimie">Physique-Chimie</option>
              <option value="SVT">SVT</option>
              <option value="Histoire-Géo">Histoire-Géo</option>
              <option value="Français">Français</option>
              <option value="Philosophie">Philosophie</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="difficulty">Difficulté</label>
            <select id="difficulty">
              <option value="débutant">Débutant</option>
              <option value="intermédiaire" selected>Intermédiaire</option>
              <option value="avancé">Avancé</option>
            </select>
          </div>

          <div class="form-group">
            <label for="link">Lien *</label>
            <input type="url" id="link" required>
          </div>
        </div>

        <div class="form-group">
          <label for="thumbnail_url">URL de l'image miniature (optionnel)</label>
          <input type="url" id="thumbnail_url" placeholder="https://exemple.com/image.jpg">
        </div>

        <div class="form-group">
          <label for="duration">Durée (pour les vidéos)</label>
          <input type="text" id="duration" placeholder="12:34">
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="is_active" checked> Ressource active
          </label>
        </div>

        <button type="submit" class="btn-primary">Ajouter la ressource</button>
      </form>
    </div>

    <!-- LISTE DES RESSOURCES -->
    <div class="admin-card">
      <h2>Ressources existantes</h2>
      <div class="table-container">
        <table id="ressources-table">
          <thead>
            <tr>
              <th>Titre</th>
              <th>Type</th>
              <th>Matière</th>
              <th>Difficulté</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="ressources-list">
            <!-- Chargé dynamiquement -->
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- SCRIPT D'ADMINISTRATION -->
  <script src="../../js/supabase-config.js"></script>
  <script>

    document.addEventListener('DOMContentLoaded', async () => {
      // Vérifie l'authentification
      const { data: { user }, error } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = '../login.html';
        return;
      }

      // Vérifie si l'utilisateur est admin (tu peux ajouter un champ role dans ta table users)
      const { data: profile, error: profileError } = await supabase
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .single();

      if (profileError || profile.role !== 'admin') {
        window.location.href = '../dashboard.html';
        return;
      }

      // Charge les ressources
      await loadRessourcesAdmin();

      // Gère la déconnexion
      document.getElementById('btn-logout').addEventListener('click', async () => {
        const { error } = await supabase.auth.signOut();
        if (!error) window.location.href = '../login.html';
      });

      // Gère l'ajout d'une ressource
      document.getElementById('add-ressource-form').addEventListener('submit', async (e) => {
        e.preventDefault();

        const formData = {
          title: document.getElementById('title').value,
          description: document.getElementById('description').value,
          type: document.getElementById('type').value,
          category: document.getElementById('category').value,
          difficulty: document.getElementById('difficulty').value,
          link: document.getElementById('link').value,
          thumbnail_url: document.getElementById('thumbnail_url').value,
          duration: document.getElementById('duration').value,
          is_active: document.getElementById('is_active').checked
        };

        const { data, error } = await supabase
          .from('ressources')
          .insert([formData])
          .select();

        if (error) {
          alert('Erreur : ' + error.message);
        } else {
          alert('Ressource ajoutée avec succès !');
          document.getElementById('add-ressource-form').reset();
          await loadRessourcesAdmin();
        }
      });
    });

    async function loadRessourcesAdmin() {
      const { data: ressources, error } = await supabase
        .from('ressources')
        .select('*')
        .order('title');

      if (error) {
        console.error('Erreur :', error);
        return;
      }

      const tbody = document.getElementById('ressources-list');
      tbody.innerHTML = '';

      ressources.forEach(ressource => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${ressource.title}</td>
          <td>${ressource.type}</td>
          <td>${ressource.category}</td>
          <td>${ressource.difficulty}</td>
          <td>
            <button class="btn-edit" onclick="editRessource('${ressource.id}')">✏️</button>
            <button class="btn-delete" onclick="deleteRessource('${ressource.id}')">🗑️</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function editRessource(id) {
      // Implémente la logique d'édition ici
      alert('Fonctionnalité d\'édition à implémenter');
    }

    async function deleteRessource(id) {
      if (confirm('Êtes-vous sûr de vouloir supprimer cette ressource ?')) {
        const { error } = await supabase
          .from('ressources')
          .delete()
          .eq('id', id);

        if (error) {
          alert('Erreur : ' + error.message);
        } else {
          alert('Ressource supprimée avec succès !');
          await loadRessourcesAdmin();
        }
      }
    }
    
  </script>
