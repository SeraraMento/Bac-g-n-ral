<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Bac Général</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="icon" href="../assets/images/logo.png" type="image/png">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h1>Connexion</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Se connecter</button>
            </form>
            <div class="login-footer">
                <a href="../index.html">← Retour à l'accueil</a>
                <p>Pas encore de compte ? <a href="register.html">Inscrivez-vous</a></p>
            </div>
        </div>
    </div>

    <script src="../js/supabase-config.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Simulation Supabase (à remplacer par ton implémentation réelle)
            if (email === 'admin@bac-general.fr' && password === 'Bac2026Admin!') {
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'admin/dashboard.html';
            } else {
                alert('Identifiants incorrects. (Utilisez : admin@bac-general.fr / Bac2026Admin!)');
            }
        });
    </script>
</body>
</html>
