<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon École — Inscription</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">
<div class="login-box">
  <div class="logo-area">
    <h1>🎓 Mon <span>École</span></h1>
    <p>Créer un compte</p>
  </div>
  <div id="alert-box"></div>
  <form id="register-form">
    <div class="form-row">
      <div class="form-group">
        <label for="nom">Nom</label>
        <input type="text" id="nom" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="prenom">Prénom</label>
        <input type="text" id="prenom" class="form-control" required>
      </div>
    </div>
    <div class="form-group">
      <label for="identifiant">Identifiant</label>
      <input type="text" id="identifiant" class="form-control" placeholder="jdupont2026" required>
      <small class="form-hint">Utilisé pour vous connecter (ex: jdupont2026)</small>
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" class="form-control" placeholder="Minimum 8 caractères" required minlength="8">
    </div>
    <div class="form-group">
      <label for="role">Vous êtes</label>
      <select id="role" class="form-control" required>
        <option value="">— Choisir —</option>
        <option value="eleve">Élève</option>
        <option value="prof">Professeur</option>
      </select>
    </div>
    <button type="submit" class="btn btn-accent" style="width:100%;padding:11px;" id="btn-register">
      Créer mon compte
    </button>
    <p class="text-center mt-16 text-sm text-muted">
      Déjà un compte ? <a href="index.html">Se connecter</a>
    </p>
    <p class="text-center mt-8 text-sm" style="background:#fef9e7;border:1px solid #f9e79f;border-radius:6px;padding:10px;color:#7d6608;font-size:.82rem;">
      ⚠️ Votre compte sera en attente de validation par un administrateur.
    </p>
  </form>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-register');
  btn.disabled = true;
  btn.textContent = 'Création en cours...';

  const nom = document.getElementById('nom').value.trim();
  const prenom = document.getElementById('prenom').value.trim();
  const identifiant = document.getElementById('identifiant').value.trim();
  const password = document.getElementById('password').value;
  const role = document.getElementById('role').value;

  try {
    const email = identifiantToEmail(identifiant);
    const { data, error } = await supabase.auth.signUp({ email, password });
    if (error) throw error;
    if (!data.user) throw new Error('Erreur lors de la création');

    // Check if identifiant already taken
    const { data: existing } = await supabase.from('profiles').select('id').eq('identifiant', identifiant).maybeSingle();
    if (existing) throw new Error('Cet identifiant est déjà utilisé.');

    // Create profile with pending flag (no admin validation needed for simplicity)
    const { error: pErr } = await supabase.from('profiles').insert({
      id: data.user.id,
      identifiant,
      nom,
      prenom,
      role,
      disabled: false
    });
    if (pErr) throw pErr;

    showAlert('Compte créé avec succès ! Vous pouvez vous connecter.', 'success');
    setTimeout(() => goTo('index.html'), 1500);
  } catch(err) {
    showAlert(err.message || 'Erreur lors de l\'inscription', 'danger');
    btn.disabled = false;
    btn.textContent = 'Créer mon compte';
  }
});
</script>

</body>
</html>
