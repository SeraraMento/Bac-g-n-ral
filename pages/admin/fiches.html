<!DOCTYPE html>
<html lang="fr">
<script>
  // Vérifier si l'utilisateur est connecté et admin
  document.addEventListener('DOMContentLoaded', async () => {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) {
      window.location.href = '../../index.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('role')
      .eq('id', user.id)
      .single();

    if (profile.role !== 'admin') {
      window.location.href = '../../index.html';
    }
  });
</script>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestion des fiches - Admin</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .admin-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-left: 0.5rem;
    }

    .form-card,
    .table-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 24px
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 12px
    }

    label {
      display: block;
      margin: 12px 0 6px;
      font-weight: 600
    }

    .btn {
      background: #d65a0a;
      color: #fff;
      border: none;
      padding: 12px 18px;
      border-radius: 999px;
      cursor: pointer
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    th,
    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
      text-align: left
    }

    .danger {
      background: #c62828;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer
    }

    .view {
      background: #111;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      text-decoration: none
    }
  </style>
</head>

<body>
  <div class="dashboard">
    <aside class="sidebar">
      <span class="sidebar-logo">Bac<span>·</span>Général <span class="admin-badge">Admin</span></span>

      <nav class="sidebar-nav">
        <span class="sidebar-section">Contenu</span>
        <a href="dashboard.html" class="sidebar-link">
          <span class="icon">📊</span> Vue d'ensemble
        </a>
        <a href="fiches.html" class="sidebar-link active">
          <span class="icon">📋</span> Fiches de cours
        </a>
        <a href="qcm.html" class="sidebar-link">
          <span class="icon">🎯</span> QCM
        </a>
        <a href="annales.html" class="sidebar-link">
          <span class="icon">📝</span> Annales
        </a>
        <a href="ressources.html" class="sidebar-link">
          <span class="icon">🎬</span> Ressources
        </a>

        <span class="sidebar-section">Utilisateurs</span>
        <a href="users.html" class="sidebar-link">
          <span class="icon">👥</span> Élèves
        </a>
        <a href="stats.html" class="sidebar-link">
          <span class="icon">📈</span> Statistiques
        </a>

        <span class="sidebar-section">Compte</span>
        <a href="../../index.html" class="sidebar-link">
          <span class="icon">🌐</span> Voir le site
        </a>
        <a href="#" class="sidebar-link" id="btn-logout">
          <span class="icon">🚪</span> Déconnexion
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Gestion des fiches PDF</h1>
        <p>Ajout et gestion des cours.</p>
      </div>

      <div class="form-card">
        <h2>Ajouter une fiche</h2>
        <div class="grid">
          <div>
            <label>Titre du chapitre</label>
            <input id="titre">
            <label>Matière</label>
            <select id="matiere">
              <option>Mathématiques</option>
              <option>Physique-Chimie</option>
              <option>SVT</option>
              <option>Français</option>
              <option>Histoire-Géographie</option>
              <option>Philosophie</option>
              <option>SES</option>
              <option>Langues</option>
            </select>
            <label>Niveau</label>
            <select id="niveau">
              <option>Seconde</option>
              <option>Première</option>
              <option>Terminale</option>
            </select>
          </div>
          <div>
            <label>Résumé</label>
            <textarea id="resume" rows="6"></textarea>
            <label>PDF</label>
            <input type="file" id="pdf" accept=".pdf">
          </div>
        </div>
        <br>
        <button class="btn" id="publishBtn">Publier la fiche</button>
        <div id="msg"></div>
      </div>

      <div class="table-card">
        <h2>Fiches publiées</h2>
        <table>
          <thead>
            <tr>
              <th>Titre</th>
              <th>Matière</th>
              <th>Niveau</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="fichesBody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../../js/supabase-config.js"></script>
  <script>
    async function loadFiches() {
      const { data, error } = await supabaseClient.from('fiches').select('*').order('created_at', { ascending: false });
      const body = document.getElementById('fichesBody');
      if (error) { body.innerHTML = '<tr><td colspan="4">' + error.message + '</td></tr>'; return; }
      body.innerHTML = data.map(f => `
 <tr>
 <td>${f.titre || ''}</td>
 <td>${f.matiere || ''}</td>
 <td>${f.niveau || ''}</td>
 <td>
 ${f.pdf_url ? `<a class="view" target="_blank" href="${f.pdf_url}">PDF</a>` : ''}
 <button class="danger" onclick="deleteFiche('${f.id}')">Supprimer</button>
 </td>
 </tr>`).join('');
    }

    async function deleteFiche(id) {
      if (!confirm('Supprimer cette fiche ?')) return;
      await supabaseClient.from('fiches').delete().eq('id', id);
      loadFiches();
    }

    document.getElementById('publishBtn').addEventListener('click', async () => {
      const titre = document.getElementById('titre').value.trim();
      const matiere = document.getElementById('matiere').value;
      const niveau = document.getElementById('niveau').value;
      const resume = document.getElementById('resume').value.trim();
      const file = document.getElementById('pdf').files[0];
      if (!titre || !file) { alert('Titre et PDF requis'); return; }

      const fileName = Date.now() + '-' + file.name;

      const upload = await supabaseClient.storage.from('cours').upload(fileName, file);
      if (upload.error) { alert(upload.error.message); return; }

      const pub = supabaseClient.storage
        .from('cours')
        .getPublicUrl(fileName);

      console.log(pub.data.publicUrl);
      const ins = await supabaseClient.from('fiches').insert({
        titre, matiere, niveau, resume, pdf_url: pub.data.publicUrl, publiee: true
      });

      if (ins.error) { alert(ins.error.message); return; }

      document.getElementById('msg').innerHTML = '<p style="color:green">Fiche publiée.</p>';
      loadFiches();
    });

    loadFiches();

    document.getElementById('btn-logout')?.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = '../../pages/login.html';
    });
  </script>
</body>

</html>
