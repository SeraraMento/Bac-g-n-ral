<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fiches de révision</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.main-content{
    padding:40px;
}

.page-header{
    margin-bottom:40px;
}

.page-header h1{
    font-size:3rem;
    margin-bottom:10px;
}

.page-header p{
    color:#666;
}

#conteneur{
    display:flex;
    flex-direction:column;
    gap:40px;
}

.matiere{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:24px;
    padding:30px;
}

.matiere h2{
    margin-bottom:25px;
    font-size:2rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:#fff;
    border:1px solid #ececec;
    border-radius:20px;
    padding:25px;
    cursor:pointer;
    transition:0.25s;
}

.card:hover{
    transform:translateY(-4px);
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    background:#f6e4d5;
    color:#e56a00;
    padding:8px 14px;
    border-radius:999px;
    margin-bottom:15px;
    font-size:.9rem;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#666;
    line-height:1.5;
}

.sidebar-section{
    display:block;
    margin:25px 0 10px;
    opacity:.6;
    font-size:.8rem;
    text-transform:uppercase;
}

.loading{
    text-align:center;
    padding:80px;
}

</style>

</head>
<body>

<div class="dashboard">

<aside class="sidebar">

    <a href="../index.html" class="sidebar-logo">
        Bac<span>·</span>Général
    </a>

    <nav class="sidebar-nav">

        <span class="sidebar-section">
            Révisions
        </span>

        <a href="dashboard.html" class="sidebar-link">
            🏠 Tableau de bord
        </a>

        <a href="fiches.html" class="sidebar-link active">
            📚 Fiches de cours
        </a>

        <a href="qcm.html" class="sidebar-link">
            🎯 QCM
        </a>

        <a href="annales.html" class="sidebar-link">
            📝 Annales
        </a>

        <a href="ressources.html" class="sidebar-link">
            🎬 Ressources
        </a>

        <span class="sidebar-section">
            Mon compte
        </span>

        <a href="profil.html" class="sidebar-link">
            👤 Mon profil
        </a>

    </nav>

</aside>

<main class="main-content">

    <div class="page-header">
        <h1>📚 Fiches de révision</h1>
        <p>Tous les cours disponibles classés par matière.</p>
    </div>

    <div id="conteneur" class="loading">
        Chargement...
    </div>

</main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>

<script>

async function chargerFiches(){

    const { data, error } = await supabaseClient
        .from('fiches')
        .select('*')
        .eq('publiee', true)
        .order('matiere')
        .order('titre');

    if(error){

        document.getElementById('conteneur').innerHTML =
            `<p>${error.message}</p>`;

        return;
    }

    const groupes = {};

    data.forEach(fiche => {

        if(!groupes[fiche.matiere]){
            groupes[fiche.matiere] = [];
        }

        groupes[fiche.matiere].push(fiche);
    });

    let html = '';

    Object.keys(groupes).forEach(matiere => {

        html += `
        <section class="matiere">

            <h2>${matiere}</h2>

            <div class="grid">
        `;

        groupes[matiere].forEach(fiche => {

            html += `
            <div class="card"
                 onclick="window.open('${fiche.pdf_url}','_blank')">

                <div class="badge">
                    ${fiche.niveau}
                </div>

                <h3>${fiche.titre}</h3>

                <p>
                    ${fiche.resume || 'Cours disponible'}
                </p>

            </div>
            `;
        });

        html += `
            </div>

        </section>
        `;
    });

    document.getElementById('conteneur').innerHTML = html;
}

chargerFiches();

</script>

</body>
</html>
