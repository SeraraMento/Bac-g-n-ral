<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login - Bac-Général</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="../../index.html" class="auth-logo">
        Bac<span>·</span>Général <span class="admin-badge">Admin</span>
      </a>

      <h2>Connexion Admin</h2>
      <p class="auth-subtitle">Veuillez vous connecter avec vos identifiants administrateur.</p>

      <div id="auth-error" class="auth-error"></div>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="admin@bac-general.fr" required>
        </div>

        <div class="form-group">
          <label>Mot de passe</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-primary">Se connecter</button>
      </form>

      <p style="margin-top:1rem; font-size:0.9rem;">
        <a href="../login.html">← Retour à la connexion élève</a>
      </p>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/supabase-config.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error) {
        document.getElementById('auth-error').innerHTML = `
          <div class="alert alert-error">
            ${error.message}
          </div>
        `;
      } else {
        // Vérifier si l'utilisateur est admin
        const { data: profile } = await supabaseClient
          .from('profiles')
          .select('role')
          .eq('id', data.user.id)
          .single();

        if (profile.role === 'admin') {
          window.location.href = 'dashboard.html';
        } else {
          document.getElementById('auth-error').innerHTML = `
            <div class="alert alert-error">
              Vous n'êtes pas administrateur !
            </div>
          `;
          await supabaseClient.auth.signOut();
        }
      }
    });
  </script>
</body>
</html>
