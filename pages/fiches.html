<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fiches de révision - Bac Général</title>

<link rel="stylesheet" href="../css/style.css">

<style>

.container{
    max-width:1400px;
    margin:40px auto;
    padding:0 30px;
}

.header{
    margin-bottom:40px;
}

.header h1{
    font-size:3rem;
    margin-bottom:10px;
}

.header p{
    color:#666;
    font-size:1.1rem;
}

.filters{
    display:flex;
    gap:15px;
    margin-top:25px;
    flex-wrap:wrap;
}

.search{
    flex:1;
    min-width:300px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    font-size:16px;
}

.select{
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    min-width:220px;
}

.stats{
    margin:30px 0;
    color:#666;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
    gap:25px;
}

.card{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:20px;
    padding:25px;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    padding:8px 14px;
    border-radius:999px;
    background:#f7e7d8;
    color:#eb6d00;
    font-size:.9rem;
    margin-bottom:15px;
}

.card h3{
    font-size:1.8rem;
    margin-bottom:15px;
}

.card p{
    color:#666;
    line-height:1.6;
}

.loading{
    text-align:center;
    padding:80px;
    font-size:1.2rem;
}

.empty{
    text-align:center;
    padding:60px;
    font-size:1.2rem;
    color:#666;
}

</style>

</head>
<body>

<div class="container">

    <div class="header">
        <h1>📚 Fiches de révision</h1>
        <p>Retrouve toutes les fiches du Bac Général.</p>

        <div class="filters">

            <input
                type="text"
                id="searchInput"
                class="search"
                placeholder="Rechercher une fiche..."
            >

            <select id="matiereFilter" class="select">
                <option value="">Toutes les matières</option>
                <option value="Mathématiques">📐 Mathématiques</option>
                <option value="SVT">🧬 SVT</option>
                <option value="Physique-Chimie">⚛️ Physique-Chimie</option>
                <option value="Français">📖 Français</option>
                <option value="Histoire-Géographie">🌍 Histoire-Géographie</option>
            </select>

        </div>
    </div>

    <div id="stats" class="stats"></div>

    <div id="grid" class="grid">
        <div class="loading">
            Chargement des fiches...
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>

<script>

let fiches = [];

const icons = {
    "Mathématiques":"📐",
    "SVT":"🧬",
    "Physique-Chimie":"⚛️",
    "Français":"📖",
    "Histoire-Géographie":"🌍"
};

async function chargerFiches(){

    const { data, error } = await supabaseClient
        .from('fiches')
        .select('*')
        .eq('publiee', true)
        .order('matiere')
        .order('titre');

    if(error){

        document.getElementById('grid').innerHTML =
            `<div class="empty">${error.message}</div>`;

        return;
    }

    fiches = data;

    afficherFiches(fiches);
}

function afficherFiches(liste){

    const grid =
        document.getElementById('grid');

    document.getElementById('stats').innerHTML =
        `${liste.length} fiche(s) disponible(s)`;

    if(liste.length === 0){

        grid.innerHTML =
            `<div class="empty">
                Aucune fiche trouvée
            </div>`;

        return;
    }

    grid.innerHTML = liste.map(fiche => `

        <div class="card"
             onclick="ouvrirFiche('${fiche.id}')">

            <div class="badge">
                ${icons[fiche.matiere] || '📚'}
                ${fiche.matiere}
            </div>

            <h3>${fiche.titre}</h3>

            <p>
                ${fiche.resume || ''}
            </p>

        </div>

    `).join('');
}

function filtrer(){

    const texte =
        document.getElementById('searchInput')
        .value
        .toLowerCase();

    const matiere =
        document.getElementById('matiereFilter')
        .value;

    let resultat = fiches;

    if(matiere){

        resultat = resultat.filter(
            f => f.matiere === matiere
        );
    }

    if(texte){

        resultat = resultat.filter(f =>

            f.titre.toLowerCase().includes(texte)

            ||

            (f.resume || '')
            .toLowerCase()
            .includes(texte)

            ||

            f.matiere
            .toLowerCase()
            .includes(texte)
        );
    }

    afficherFiches(resultat);
}

function ouvrirFiche(id){

    window.location.href =
        `fiche.html?id=${id}`;
}

document
.getElementById('searchInput')
.addEventListener('input', filtrer);

document
.getElementById('matiereFilter')
.addEventListener('change', filtrer);

chargerFiches();

</script>

</body>
</html>
