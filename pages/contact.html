<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Contact - Bac-Général</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
  <!-- NAV -->
  <nav class="navbar">
    <div class="nav-logo">Bac<span>·</span>Général</div>
    <div class="nav-links">
      <a href="fiches.html">Fiches</a>
      <a href="qcm.html">QCM</a>
      <a href="annales.html">Annales</a>
      <a href="ressources.html">Ressources</a>
    </div>
    <div class="nav-auth">
      <a href="login.html" class="btn-login">Connexion</a>
      <a href="register.html" class="btn-register">S'inscrire</a>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">
    <div class="page-header">
      <h1>📧 Contactez-nous</h1>
      <p>Une question ? Une suggestion ? Contactez-nous !</p>
    </div>

    <div class="form-card">
      <h2>Formulaire de contact</h2>
      <form id="contact-form" class="contact-form">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="name" placeholder="Jean Dupont" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="jean.dupont@example.com" required>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea id="message" rows="5" placeholder="Votre message..." required></textarea>
        </div>
        <button type="submit" class="btn-primary">Envoyer</button>
      </form>
      <div id="contact-msg" class="contact-msg"></div>
    </div>
  </main>

  <!-- SCRIPTS -->
  <script>
    document.getElementById('contact-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const message = document.getElementById('message').value;

      // Ici, tu peux envoyer un email via Supabase Edge Functions ou un service comme Formspree
      document.getElementById('contact-msg').innerHTML = `
        <div class="alert alert-success">
          Merci pour votre message ! Nous vous répondrons rapidement.
        </div>
      `;
      document.getElementById('contact-form').reset();
    });
  </script>
</body>
</html>
