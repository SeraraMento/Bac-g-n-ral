<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon École - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <h1>🎓 Mon École</h1>
        <p>Plateforme éducative</p>
        <form id="loginForm">
            <div>
                <label>Identifiant</label>
                <input type="text" id="identifiant" placeholder="admin2026" required>
            </div>
            <div>
                <label>Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Connexion</button>
        </form>
        <p id="error" style="color: red; margin-top: 10px;"></p>
        <p style="text-align: center; margin-top: 20px;">
            Pas encore de compte ? <a href="register.html">S'inscrire</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="login.js"></script>
</body>
</html>
