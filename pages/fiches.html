<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fiches de révision</title>

<link rel="stylesheet" href="../css/style.css">

<style>
.container{
    max-width:1400px;
    margin:40px auto;
    padding:0 30px;
}

.matiere{
    margin-bottom:50px;
}

.matiere h2{
    margin-bottom:20px;
    font-size:2rem;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.card{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:20px;
    padding:25px;
    cursor:pointer;
    transition:.25s;
}

.card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    background:#f5e5d6;
    color:#e56a00;
    padding:8px 14px;
    border-radius:999px;
    margin-bottom:15px;
}

.card h3{
    margin-bottom:10px;
}

.card p{
    color:#666;
}
</style>

</head>
<body>

<div class="container">

<h1>📚 Fiches de révision</h1>

<div id="conteneur">
Chargement...
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>

<script>

async function chargerFiches(){

    const { data, error } = await supabaseClient
        .from('fiches')
        .select('*')
        .eq('publiee', true)
        .order('matiere')
        .order('titre');

    if(error){

        document.getElementById('conteneur').innerHTML =
            error.message;

        return;
    }

    const groupes = {};

    data.forEach(fiche => {

        if(!groupes[fiche.matiere])
            groupes[fiche.matiere] = [];

        groupes[fiche.matiere].push(fiche);
    });

    let html = '';

    Object.keys(groupes).forEach(matiere => {

        html += `
        <section class="matiere">

            <h2>${matiere}</h2>

            <div class="grid">
        `;

        groupes[matiere].forEach(fiche => {

            html += `

            <div class="card"
                 onclick="window.open('${fiche.pdf_url}','_blank')">

                <div class="badge">
                    ${fiche.niveau}
                </div>

                <h3>${fiche.titre}</h3>

                <p>
                    ${fiche.resume || ''}
                </p>

            </div>

            `;
        });

        html += `
            </div>
        </section>
        `;
    });

    document.getElementById('conteneur').innerHTML = html;
}

chargerFiches();

</script>

</body>
</html>
