<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon École - Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-page">
        <div class="login-box">
            <div class="logo-area">
                <h1>Mon<span>École</span></h1>
                <p>Plateforme Scolaire</p>
            </div>

            <!-- TABS -->
            <div class="login-tabs">
                <button class="login-tab active" data-tab="login">Connexion</button>
                <button class="login-tab" data-tab="register">Inscription</button>
            </div>

            <!-- LOGIN TAB -->
            <div id="login" class="tab-content active">
                <form id="loginForm">
                    <div id="error" class="alert alert-danger" style="display:none;"></div>
                    
                    <div class="form-group">
                        <label>Identifiant</label>
                        <input type="text" id="identifiant" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="password" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;">Connexion</button>
                </form>
            </div>

            <!-- REGISTER TAB -->
            <div id="register" class="tab-content">
                <form id="registerForm">
                    <div id="register-error" class="alert alert-danger" style="display:none;"></div>
                    
                    <div class="form-group">
                        <label>Nom complet</label>
                        <input type="text" id="reg-name" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="reg-email" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="reg-password" class="form-control" required>
                    </div>

                    <div class="form-group">
                        <label>Rôle</label>
                        <select id="reg-role" class="form-control">
                            <option value="eleve">Élève</option>
                            <option value="prof">Professeur</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary" style="width:100%;">Inscription</button>
                </form>
            </div>
        </div>
    </div>

    <!-- SUPABASE CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.0"></script>
    
    <!-- TON SCRIPT LOGIN (SEUL) -->
    <script src="login.js"></script>

    <!-- TAB SWITCHER -->
    <script>
        document.querySelectorAll('.login-tab').forEach(tab => {
            tab.addEventListener('click', (e) => {
                const tabName = e.target.dataset.tab;
                
                document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                
                e.target.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });
    </script>
</body>
</html>
