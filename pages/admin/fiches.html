<script>
(async () => {

  const liste =
    document.getElementById('liste');

  const { data, error } =
    await supabaseClient
      .from('fiches')
      .select('*')
      .order('created_at', {
        ascending:false
      });

  console.log(data);
  console.log(error);

  if(error){
    liste.innerHTML =
      '<h2>Erreur : ' +
      error.message +
      '</h2>';
    return;
  }

  if(!data || data.length === 0){
    liste.innerHTML =
      '<h2>Aucune fiche trouvée</h2>';
    return;
  }

  liste.innerHTML =
    data.map(f => `
      <div style="
        background:white;
        border:1px solid #ddd;
        padding:20px;
        margin-bottom:15px;
        border-radius:12px;
      ">
        <h3>${f.titre}</h3>
        <p>${f.matiere}</p>
        <p>${f.niveau}</p>
      </div>
    `).join('');

})();
</script>
