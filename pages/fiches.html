<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fiches de révision - Bac Général</title>

<link rel="stylesheet" href="../css/style.css">

<style>
.fiches-container{
    max-width:1200px;
    margin:40px auto;
    padding:0 20px;
}

.fiches-header{
    margin-bottom:40px;
}

.fiches-header h1{
    font-size:48px;
    margin-bottom:10px;
}

.search-box{
    width:100%;
    max-width:500px;
    padding:15px;
    border:1px solid #ddd;
    border-radius:12px;
    margin-top:20px;
}

.fiches-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:20px;
}

.fiche-card{
    background:white;
    border:1px solid #e5e5e5;
    border-radius:20px;
    padding:25px;
    cursor:pointer;
    transition:0.3s;
}

.fiche-card:hover{
    transform:translateY(-5px);
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.badge{
    display:inline-block;
    background:#f6e6d9;
    color:#e56a00;
    padding:6px 12px;
    border-radius:999px;
    font-size:14px;
    margin-bottom:15px;
}

.fiche-card h3{
    margin-bottom:10px;
}

.fiche-card p{
    color:#666;
    line-height:1.5;
}

.loading{
    text-align:center;
    padding:60px;
}
</style>
</head>

<body>

<div class="fiches-container">

    <div class="fiches-header">
        <h1>Fiches de révision</h1>
        <p>Retrouve toutes les fiches du Bac Général.</p>

        <input
            type="text"
            id="searchInput"
            class="search-box"
            placeholder="Rechercher une fiche..."
        >
    </div>

    <div id="fichesGrid" class="fiches-grid">
        <div class="loading">Chargement...</div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>

<script>

let fiches = [];

async function chargerFiches() {

    const grid =
        document.getElementById('fichesGrid');

    const { data, error } =
        await supabaseClient
            .from('fiches')
            .select('*')
            .eq('publiee', true)
            .order('titre');

    if(error){
        grid.innerHTML =
            `<h2>${error.message}</h2>`;
        return;
    }

    fiches = data;

    afficherFiches(fiches);
}

function afficherFiches(liste){

    const grid =
        document.getElementById('fichesGrid');

    if(liste.length === 0){

        grid.innerHTML =
            '<p>Aucune fiche trouvée.</p>';

        return;
    }

    grid.innerHTML =
        liste.map(fiche => `

        <div class="fiche-card"
             onclick="ouvrirFiche('${fiche.id}')">

            <div class="badge">
                ${fiche.matiere}
            </div>

            <h3>${fiche.titre}</h3>

            <p>
                ${fiche.resume || ''}
            </p>

        </div>

        `).join('');
}

function ouvrirFiche(id){

    window.location.href =
        `fiche.html?id=${id}`;
}

document
.getElementById('searchInput')
.addEventListener('input', e => {

    const texte =
        e.target.value.toLowerCase();

    const resultat =
        fiches.filter(f =>

            f.titre
            .toLowerCase()
            .includes(texte)

            ||

            f.matiere
            .toLowerCase()
            .includes(texte)
        );

    afficherFiches(resultat);
});

chargerFiches();

</script>

</body>
</html>
