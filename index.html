<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MonÉcole - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <h1>Mon<span class="logo-accent">École</span></h1>
                <p class="subtitle">Plateforme Scolaire</p>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="login">Connexion</button>
                <button class="tab-btn" data-tab="signup">Inscription</button>
            </div>

            <!-- TAB CONNEXION -->
            <div id="login" class="tab-content active">
                <form id="loginForm">
                    <div id="loginError" class="error-message"></div>

                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Mot de passe</label>
                        <input type="password" id="loginPassword" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary">Connexion</button>
                </form>
            </div>

            <!-- TAB INSCRIPTION -->
            <div id="signup" class="tab-content">
                <form id="signupForm">
                    <div id="signupError" class="error-message"></div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Mot de passe</label>
                        <input type="password" id="signupPassword" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="signupConfirm">Confirmer mot de passe</label>
                        <input type="password" id="signupConfirm" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary">S'inscrire</button>
                </form>
            </div>
        </div>
    </div>

    <!-- ⭐ LIBRAIRIE SUPABASE ⭐ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Ton script -->
    <script src="js/login.js"></script>
</body>
</html>
