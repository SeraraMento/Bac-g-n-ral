<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ressources - Bac Général</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Ressources pédagogiques</h1>
      <nav>
        <a href="../index.html">Accueil</a> |
        <a href="fiches.html">Fiches</a> |
        <a href="qcm.html">QCM</a> |
        <a href="annales.html">Annales</a> |
        <a href="login.html">Connexion</a>
      </nav>
    </header>

    <main>
      <section class="resources-container">
        <h2>Trouve des ressources adaptées à ton niveau</h2>

        <div class="filters">
          <select id="filter-category">
            <option value="">Toutes les matières</option>
            <option value="Maths">Maths</option>
            <option value="Physique-Chimie">Physique-Chimie</option>
            <option value="SVT">SVT</option>
            <option value="Histoire-Géo">Histoire-Géographie</option>
            <option value="Français">Français</option>
            <option value="Philosophie">Philosophie</option>
            <option value="Anglais">Anglais</option>
          </select>

          <select id="filter-type">
            <option value="">Tous les types</option>
            <option value="video">Vidéos</option>
            <option value="lien">Liens externes</option>
            <option value="pdf">PDF</option>
            <option value="fiche">Fiches de cours</option>
          </select>

          <select id="filter-difficulty">
            <option value="">Toutes difficultés</option>
            <option value="débutant">Débutant</option>
            <option value="intermédiaire">Intermédiaire</option>
            <option value="avancé">Avancé</option>
          </select>
        </div>

        <div class="resources-grid" id="resources-grid">
          <!-- Les ressources seront chargées ici -->
          <p>Chargement en cours...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="../js/supabase-config.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Charge les ressources
      await loadRessources();

      // Gestion des filtres
      document.getElementById('filter-category').addEventListener('change', filterRessources);
      document.getElementById('filter-type').addEventListener('change', filterRessources);
      document.getElementById('filter-difficulty').addEventListener('change', filterRessources);
    });

    async function loadRessources() {
      try {
        const { data: ressources, error } = await supabase
          .from('ressources')
          .select('*')
          .eq('is_active', true)
          .order('title');

        if (error) throw error;

        const grid = document.getElementById('resources-grid');
        grid.innerHTML = '';

        if (!ressources || ressources.length === 0) {
          grid.innerHTML = '<p>Aucune ressource disponible pour le moment.</p>';
          return;
        }

        ressources.forEach(ressource => {
          const card = document.createElement('div');
          card.className = 'resource-card';

          // Gestion de l'image/thumbnail
          let thumbnailHtml = '';
          if (ressource.thumbnail_url) {
            thumbnailHtml = `<img src="${ressource.thumbnail_url}" alt="${ressource.title}" class="resource-thumbnail">`;
          } else {
            // Image par défaut selon le type
            const defaultImages = {
              video: 'https://via.placeholder.com/300x180/ff6b6b/ffffff?text=Vidéo',
              lien: 'https://via.placeholder.com/300x180/4ecdc4/ffffff?text=Lien',
              pdf: 'https://via.placeholder.com/300x180/45b7d1/ffffff?text=PDF',
              fiche: 'https://via.placeholder.com/300x180/f9ca24/ffffff?text=Fiche'
            };
            thumbnailHtml = `<img src="${defaultImages[ressource.type] || defaultImages.lien}" alt="${ressource.title}" class="resource-thumbnail">`;
          }

          card.innerHTML = `
            ${thumbnailHtml}
            <div class="resource-content">
              <span class="resource-category">${ressource.category}</span>
              <h3 class="resource-title">${ressource.title}</h3>
              <p class="resource-description">${ressource.description}</p>
              <div class="resource-meta">
                <span class="resource-type">${ressource.type}</span>
                <span class="resource-difficulty difficulty-${ressource.difficulty}">
                  ${ressource.difficulty}
                </span>
              </div>
              ${ressource.link ? `
                <a href="${ressource.link}" class="btn-download" target="_blank">
                  Voir la ressource
                </a>
              ` : ''}
            </div>
          `;

          grid.appendChild(card);
        });
      } catch (err) {
        console.error('Erreur lors du chargement des ressources:', err);
        document.getElementById('resources-grid').innerHTML =
          '<p>Une erreur est survenue lors du chargement des ressources.</p>';
      }
    }

    function filterRessources() {
      const category = document.getElementById('filter-category').value;
      const type = document.getElementById('filter-type').value;
      const difficulty = document.getElementById('filter-difficulty').value;

      const cards = document.querySelectorAll('.resource-card');
      cards.forEach(card => {
        const cardCategory = card.querySelector('.resource-category').textContent;
        const cardType = card.querySelector('.resource-type').textContent;
        const cardDifficulty = card.querySelector('.resource-difficulty').textContent.trim();

        const matchesCategory = !category || cardCategory === category;
        const matchesType = !type || cardType === type;
        const matchesDifficulty = !difficulty || cardDifficulty === difficulty;

        if (matchesCategory && matchesType && matchesDifficulty) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
