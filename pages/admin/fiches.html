<script>
(async () => {

  const liste = document.getElementById('liste');

  try {

    const { data, error } = await supabaseClient
      .from('fiches')
      .select('*');

    console.log("DATA:", data);
    console.log("ERROR:", error);

    if (error) {
      liste.innerHTML =
        "<h2 style='color:red'>" +
        error.message +
        "</h2>";
      return;
    }

    liste.innerHTML =
      "<pre>" +
      JSON.stringify(data, null, 2) +
      "</pre>";

  } catch(err) {

    console.error(err);

    liste.innerHTML =
      "<h2 style='color:red'>" +
      err.message +
      "</h2>";
  }

})();
</script>
