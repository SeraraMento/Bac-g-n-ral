<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon École — Connexion</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="login-page">
<div class="login-box">
  <div class="logo-area">
    <h1>🎓 Mon <span>École</span></h1>
    <p>Plateforme éducative</p>
  </div>
  <div id="alert-box"></div>
  <form id="login-form">
    <div class="form-group">
      <label for="identifiant">Identifiant</label>
      <input type="text" id="identifiant" class="form-control" placeholder="jdupont2026" required autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary" style="width:100%;padding:11px;" id="btn-login">
      Connexion
    </button>
    <p class="text-center mt-16 text-sm text-muted">
      Pas encore de compte ? <a href="register.html">S'inscrire</a>
    </p>
  </form>
</div>
<script src="js/supabase-client.js"></script>
<script src="js/utils.js"></script>
<script>
// Auto redirect if already logged in
(function() {
  const user = getUser();
  if (user) {
    const dests = { admin: 'admin/dashboard.html', prof: 'prof/dashboard.html', eleve: 'eleve/dashboard.html' };
    if (dests[user.role]) window.location.href = dests[user.role];
  }
})();

document.getElementById('login-form').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  btn.textContent = 'Connexion...';

  const identifiant = document.getElementById('identifiant').value.trim();
  const password = document.getElementById('password').value;

  try {
    const email = identifiantToEmail(identifiant);
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;

    // Fetch profile
    const { data: profile, error: pErr } = await supabase
      .from('profiles')
      .select('*')
      .eq('id', data.user.id)
      .single();

    if (pErr) throw pErr;
    if (profile.disabled) {
      await supabase.auth.signOut();
      throw new Error('Votre compte a été désactivé. Contactez un administrateur.');
    }

    setUser(profile);
    const dests = { admin: 'admin/dashboard.html', prof: 'prof/dashboard.html', eleve: 'eleve/dashboard.html' };
    goTo(dests[profile.role] || 'index.html');
  } catch(err) {
    showAlert(err.message || 'Erreur de connexion', 'danger');
    btn.disabled = false;
    btn.textContent = 'Connexion';
  }
});
</script>

</body>
</html>
