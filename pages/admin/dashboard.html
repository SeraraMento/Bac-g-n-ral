<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin | Bac Général</title>
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/admin.css"> <!-- CSS spécifique admin -->
    <link rel="icon" href="../../assets/images/logo.png" type="image/png">
</head>
<body>
    <div class="admin-layout">
        <!-- Barre latérale -->
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <p>Bac Général</p>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active">
                    <span>📊</span> Tableau de bord
                </a>
                <a href="fiches.html">
                    <span>📝</span> Fiches
                </a>
                <a href="qcm.html">
                    <span>❓</span> QCM
                </a>
                <a href="annales.html">
                    <span>📄</span> Annales
                </a>
                <a href="ressources.html">
                    <span>🔗</span> Ressources
                </a>
                <a href="users.html">
                    <span>👤</span> Utilisateurs
                </a>
                <a href="stats.html">
                    <span>📈</span> Statistiques
                </a>
                <a href="../login.html" class="logout-link">
                    <span>↩️</span> Déconnexion
                </a>
            </nav>
        </aside>

        <!-- Contenu principal -->
        <main class="admin-content">
            <header class="admin-header">
                <h1>Tableau de bord</h1>
                <div class="admin-stats">
                    <div class="stat-card">
                        <h3>Fiches</h3>
                        <p>24</p>
                    </div>
                    <div class="stat-card">
                        <h3>QCM</h3>
                        <p>18</p>
                    </div>
                    <div class="stat-card">
                        <h3>Annales</h3>
                        <p>12</p>
                    </div>
                    <div class="stat-card">
                        <h3>Visites</h3>
                        <p>420</p>
                    </div>
                </div>
            </header>

            <section class="admin-section">
                <h2>Actions rapides</h2>
                <div class="quick-actions">
                    <a href="fiches.html" class="action-card">
                        <div class="action-icon">📝</div>
                        <h3>Gérer les fiches</h3>
                    </a>
                    <a href="qcm.html" class="action-card">
                        <div class="action-icon">❓</div>
                        <h3>Gérer les QCM</h3>
                    </a>
                    <a href="annales.html" class="action-card">
                        <div class="action-icon">📄</div>
                        <h3>Gérer les annales</h3>
                    </a>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Vérification de la session admin
        if (localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = '../login.html';
        }

        // Déconnexion
        document.querySelector('.logout-link').addEventListener('click', (e) => {
            e.preventDefault();
            localStorage.removeItem('adminLoggedIn');
            window.location.href = '../login.html';
        });
    </script>
</body>
</html>
