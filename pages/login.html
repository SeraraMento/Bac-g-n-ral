<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — Bac-Général</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="auth-logo">Bac<span>·</span>Général</a>
      <h2>Bon retour !</h2>
      <p class="auth-subtitle">Connecte-toi pour accéder à tes révisions</p>

      <div class="auth-error" id="auth-error"></div>

      <div class="form-group">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="ton@email.fr" autocomplete="email" />
      </div>

      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button class="btn-submit" id="btn-login">Se connecter</button>

      <p class="auth-footer">
        Pas encore de compte ? <a href="register.html">S'inscrire</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/supabase-config.js"></script>
  <script>
    const btnLogin = document.getElementById('btn-login');
    const errorBox = document.getElementById('auth-error');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.classList.add('visible');
    }

    btnLogin.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Merci de remplir tous les champs.');
        return;
      }

      btnLogin.textContent = 'Connexion…';
      btnLogin.disabled = true;
      errorBox.classList.remove('visible');

      const { data, error } = await signIn(email, password);

      if (error) {
        showError('Email ou mot de passe incorrect.');
        btnLogin.textContent = 'Se connecter';
        btnLogin.disabled = false;
        return;
      }

      // Redirection selon le rôle
      if (isAdmin(data.user)) {
        window.location.href = 'admin/dashboard.html';
      } else {
        window.location.href = 'dashboard.html';
      }
    });

    // Entrée clavier
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') btnLogin.click();
    });
  </script>
</body>
</html>
